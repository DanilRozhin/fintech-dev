# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 119
indent-width = 4

# Assume Python 3.10
target-version = "py314"

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
select = [
    "E",      # pycodestyle (ошибки)
    "W",      # pycodestyle (предупреждения)
    "F",      # Pyflakes (неиспользуемые импорты, переменные)
    "I",      # isort (сортировка импортов)
    "N",      # pep8-naming (нейминг классов, функций)
    "UP",     # pyupgrade (устаревший синтаксис Python)
    "B",      # flake8-bugbear (найденные баги)
    "C4",     # flake8-comprehensions (улучшение генераторов)
    "SIM",    # flake8-simplify (упрощение кода)
    "PT",     # flake8-pytest (стиль тестов)
    "T20",    # flake8-print (запрет на print)
    "G",      # flake8-logging (правильное логирование)
    "RUF",    # собственные правила Ruff
    "FIX002", # todos searching
]
ignore = ["D100", "UP017"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

exclude = ["app/alembic/versions/*"]

[lint.per-file-ignores]
"app/database/models/*.py" = ["UP037"]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
